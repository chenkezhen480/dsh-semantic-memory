# 插件自带的补丁层，安装时自动生效：
# `dsh plugin --profile web add dsh-plugin-semantic-memory`
# （package.json 中的 dsh.bundle.patch 声明会把本层加入 profile 的 bundles）。
#
# 开发模式：本文件同时承载部署默认配置（当前使用该包时的取值）。
# 以 file: 链接安装时，loader 每次启动都会实时读取本文件——
# 改动后重启 dsh web 即生效，无需重新安装。
# 若用于公开发布，请把部署相关取值移出本文件，让用户通过
# settings.yaml（semantic-memory: 段）或自己的 profile patch 覆盖，
# 那些层始终优先于本层。
- insert:
    - id: semantic-memory
      name: 'dsh-plugin-semantic-memory'
      config:
        remoteHost: https://hf-mirror.com
        promptTopK: 3
        minScore: 0.35
        autoSummarizeEvery: 5
